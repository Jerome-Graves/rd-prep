<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R&D Prep</title>
    <meta name="description" content="Interactive refresher for R&D instrumentation interviews: C++, DSP, acoustics, control, electronics, embedded and numerical maths.">
    <style>
        :root {
            --bg: #ffffff; --bg-alt: #f6f7f9; --text: #1c2127; --muted: #5b6672;
            --accent: #1d7a4f; --line: #e4e7eb; --good: #1d7a4f; --bad: #b3383e;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14171b; --bg-alt: #1b1f25; --text: #e8eaed; --muted: #9aa4af;
                --accent: #4ecb8d; --line: #2a2f36; --good: #4ecb8d; --bad: #f2716f;
            }
        }
        :root[data-theme="dark"] {
            --bg: #14171b; --bg-alt: #1b1f25; --text: #e8eaed; --muted: #9aa4af;
            --accent: #4ecb8d; --line: #2a2f36; --good: #4ecb8d; --bad: #f2716f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.65; font-size: 16px;
        }
        a { color: var(--accent); }
        header {
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line);
            background: var(--bg); padding: 12px 20px; display: flex; align-items: center; gap: 14px;
        }
        header .brand { font-weight: 700; font-size: 17px; color: var(--text); text-decoration: none; }
        header .spacer { flex: 1; }
        .streak { font-size: 13px; color: var(--muted); }
        .streak b { color: var(--accent); }
        #theme-toggle {
            background: none; border: 1px solid var(--line); border-radius: 7px; color: var(--muted);
            cursor: pointer; font: inherit; font-size: 13px; padding: 4px 9px;
        }
        #theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
        .layout { display: flex; max-width: 1100px; margin: 0 auto; }
        nav.side {
            width: 250px; flex-shrink: 0; padding: 22px 14px; border-right: 1px solid var(--line);
            min-height: calc(100vh - 54px);
        }
        nav.side button.track {
            display: flex; align-items: center; gap: 7px; width: calc(100% - 12px);
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
            color: var(--accent); margin: 10px 6px 2px; padding: 5px 6px; border-radius: 7px;
            background: none; border: 0; cursor: pointer; font-family: inherit; text-align: left;
        }
        nav.side button.track:hover { background: var(--bg-alt); }
        nav.side button.track .caret { transition: transform .15s ease; flex-shrink: 0; }
        nav.side button.track.open .caret { transform: rotate(90deg); }
        nav.side button.track .tname { flex: 1; }
        nav.side button.track .tcount { color: var(--muted); font-weight: 600; letter-spacing: 0; }
        nav.side .tgroup { display: none; }
        nav.side .tgroup.open { display: block; }
        nav.side a.lesson {
            display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px;
            color: var(--text); text-decoration: none; font-size: 14px;
        }
        nav.side a.lesson:hover { background: var(--bg-alt); }
        nav.side a.lesson.active { background: var(--bg-alt); font-weight: 600; }
        nav.side a.lesson .tick { color: var(--good); }
        nav.side a.top { display:block; padding: 6px 8px; border-radius: 7px; color: var(--text);
            text-decoration: none; font-weight: 600; font-size: 14px; }
        nav.side a.top.active { background: var(--bg-alt); }
        main { flex: 1; padding: 28px 30px 70px; min-width: 0; }
        h1 { font-size: 26px; letter-spacing: -0.3px; margin-bottom: 6px; }
        h2 { font-size: 20px; margin: 26px 0 10px; }
        h3 { font-size: 16px; margin: 20px 0 8px; }
        .lesson-meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
        .body p, .body ul, .body ol { margin: 10px 0; color: var(--text); }
        .body ul, .body ol { padding-left: 22px; }
        .body li { margin: 5px 0; }
        .body pre {
            background: var(--bg-alt); border: 1px solid var(--line); border-radius: 8px;
            padding: 12px 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.55;
            font-family: Consolas, "Cascadia Code", Menlo, monospace; margin: 12px 0;
        }
        .card { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 10px;
            padding: 16px 18px; margin: 14px 0; }
        .qq { font-weight: 600; margin-bottom: 8px; }
        /* code shown inside a question, and inside an explanation */
        .qq pre, .why pre {
            background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.5;
            font-family: Consolas, "Cascadia Code", Menlo, monospace; margin: 10px 0;
            font-weight: 400; white-space: pre; color: var(--text);
        }
        .why pre { background: var(--bg); }
        .qq code, .why code, .opt code { font-family: Consolas, "Cascadia Code", Menlo, monospace; font-size: .94em; }
        .qtag {
            display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
            text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent);
            border-radius: 4px; padding: 1px 6px; margin-right: 8px; vertical-align: 2px;
        }
        .opt pre {
            background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
            padding: 8px 10px; margin: 0; overflow-x: auto; font-size: 12.5px; line-height: 1.45;
            font-family: Consolas, "Cascadia Code", Menlo, monospace; white-space: pre;
        }
        .opt {
            display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 12px;
            border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
            color: var(--text); cursor: pointer; font: inherit; font-size: 14.5px;
        }
        .opt:hover:not(:disabled) { border-color: var(--accent); }
        .opt:disabled { cursor: default; opacity: .85; }
        .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg)); }
        .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg)); }
        .why { font-size: 14px; color: var(--muted); margin-top: 8px; display: none; line-height: 1.55; }
        .why.show { display: block; }
        .why p { margin: 0 0 8px; }
        .why p:last-child { margin-bottom: 0; }
        /* glossary term + its floating tooltip */
        .gloss {
            border-bottom: 1px dashed var(--accent); cursor: help; outline: none;
        }
        .gloss:hover, .gloss:focus { background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 3px; }
        #glosspop {
            position: fixed; z-index: 999; max-width: 340px; opacity: 0; visibility: hidden;
            transition: opacity .12s ease; pointer-events: none;
            background: var(--bg); color: var(--text); border: 1px solid var(--accent);
            border-radius: 9px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5;
            font-weight: 400; text-align: left; box-shadow: 0 8px 26px rgba(0,0,0,.35);
        }
        #glosspop.show { opacity: 1; visibility: visible; pointer-events: auto; }
        #glosspop .gp-term { font-weight: 700; color: var(--accent); margin-bottom: 4px;
            font-family: Consolas, "Cascadia Code", Menlo, monospace; font-size: 13px; }
        #glosspop .gp-def { margin-bottom: 8px; }
        #glosspop .gp-def code { font-family: Consolas, "Cascadia Code", Menlo, monospace;
            font-size: .93em; background: var(--bg-alt); padding: 1px 4px; border-radius: 3px; }
        #glosspop .gp-link { color: var(--accent); font-weight: 600; text-decoration: none;
            font-size: 12.5px; display: inline-block; border-top: 1px solid var(--line);
            padding-top: 7px; width: 100%; }
        #glosspop .gp-link:hover { text-decoration: underline; }

        .lref { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
        .lref > summary {
            cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px;
            list-style: none; padding: 4px 0; user-select: none;
        }
        .lref > summary::-webkit-details-marker { display: none; }
        .lref > summary::before { content: "\25B8 "; display: inline-block; transition: transform .15s ease; }
        .lref[open] > summary::before { transform: rotate(90deg); }
        .lref-body {
            margin-top: 10px; max-height: 46vh; overflow-y: auto; padding: 12px 14px;
            background: var(--bg-alt); border: 1px solid var(--line); border-radius: 8px;
            color: var(--text); font-size: 14.5px; line-height: 1.6;
        }
        .lref-body h3 { font-size: 15px; margin: 16px 0 6px; }
        .lref-body h3:first-child { margin-top: 0; }
        .lref-body p, .lref-body li { font-size: 14.5px; }
        .lref-body pre { max-width: 100%; overflow-x: auto; }
        .lref-open { display: inline-block; margin-top: 10px; color: var(--accent);
            font-weight: 600; font-size: 14px; text-decoration: none; }
        .lref-open:hover { text-decoration: underline; }
        .reveal-btn, .btn {
            border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px;
            padding: 8px 16px; cursor: pointer; font: inherit; font-size: 14.5px; text-decoration: none;
            display: inline-block;
        }
        .reveal-btn:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .btn.done { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .model { display: none; margin-top: 10px; }
        .model.show { display: block; }
        .navrow { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        .progressbar { height: 8px; background: var(--bg-alt); border: 1px solid var(--line);
            border-radius: 6px; overflow: hidden; margin: 6px 0 2px; }
        .progressbar > div { height: 100%; background: var(--accent); }
        .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
        .tracks .t { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
        .tracks .t .name { font-weight: 600; font-size: 14px; }
        .tracks .t .n { color: var(--muted); font-size: 13px; }
        .muted { color: var(--muted); }
        .scorechip { font-size: 12.5px; color: var(--muted); }
        .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .pill { border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; cursor: pointer;
            background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
        .pill.sel { border-color: var(--accent); color: var(--accent); font-weight: 600; }
        table.stats { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0; }
        table.stats th, table.stats td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
        table.stats th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
        .acc { display: inline-block; min-width: 46px; }
        .minibar { display: inline-block; width: 90px; height: 7px; background: var(--bg-alt);
            border: 1px solid var(--line); border-radius: 5px; overflow: hidden; vertical-align: middle; margin-left: 8px; }
        .minibar > div { height: 100%; }
        .good-bg { background: var(--good); } .bad-bg { background: var(--bad); }
        .testhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        @media (max-width: 760px) {
            .layout { flex-direction: column; }
            nav.side { width: 100%; min-height: 0; border-right: none; border-bottom: 1px solid var(--line);
                display: flex; flex-wrap: wrap; gap: 2px; padding: 10px; }
            nav.side button.track { width: calc(100% - 12px); margin: 8px 6px 2px; }
            nav.side .tgroup { width: 100%; }
            main { padding: 20px 16px 60px; }
        }
    </style>
</head>

<body>
    <header>
        <a class="brand" href="#home">R&amp;D Prep</a>
        <span class="muted" style="font-size:13px">interview refresher</span>
        <span class="spacer"></span>
        <span class="streak" id="streak"></span>
        <button id="theme-toggle" aria-label="Switch theme">&#9789;</button>
    </header>
    <div class="layout">
        <nav class="side" id="sidenav"></nav>
        <main id="main"></main>
    </div>

    <script src="data.js"></script>
    <script src="lessons_cpp.js"></script>
    <script src="lessons_dsp.js"></script>
    <script src="lessons_acoustics.js"></script>
    <script src="lessons_control.js"></script>
    <script src="lessons_electronics.js"></script>
    <script src="lessons_csmaths.js"></script>
    <script src="lessons_robotics.js"></script>
    <script src="lessons_rtl.js"></script>
    <script src="lessons2_cpp.js"></script>
    <script src="lessons2_dsp.js"></script>
    <script src="lessons2_acoustics.js"></script>
    <script src="lessons2_control.js"></script>
    <script src="lessons2_electronics.js"></script>
    <script src="lessons2_csmaths.js"></script>
    <script src="lessons2_robotics.js"></script>
    <script src="lessons2_rtl.js"></script>
    <script src="lessons_embc.js"></script>
    <script src="lessons2_embc.js"></script>
    <script src="lessons3_embc.js"></script>
    <script src="lessons4_embc.js"></script>
    <script>const BANKS = {};</script>
    <script src="bank_cpp.js"></script>
    <script src="bank_dsp.js"></script>
    <script src="bank_acoustics.js"></script>
    <script src="bank_control.js"></script>
    <script src="bank_electronics.js"></script>
    <script src="bank_csmaths.js"></script>
    <script src="bank_robotics.js"></script>
    <script src="bank_rtl.js"></script>
    <script src="bank_embc.js"></script>
    <script src="bank_embc2.js"></script>
    <script src="bank_embc3.js"></script>
    <script src="bank_embc_code.js"></script>
    <script src="glossary.js"></script>
    <script>
        // ---------- state ----------
        const KEY = "rdprep-v1";
        function loadState() {
            try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
        }
        function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }
        const state = Object.assign({ done: {}, quiz: {}, visits: [], results: {}, navOpen: {} }, loadState());
        if (!state.navOpen) state.navOpen = {};
        if (!state.results) state.results = {};

        const today = new Date().toISOString().slice(0, 10);
        if (!state.visits.includes(today)) { state.visits.push(today); saveState(state); }
        function streakCount() {
            const set = new Set(state.visits);
            let n = 0; const d = new Date();
            while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
            return n;
        }

        // ---------- theme ----------
        (function () {
            const root = document.documentElement, btn = document.getElementById("theme-toggle");
            const media = window.matchMedia("(prefers-color-scheme: dark)");
            function current() { return root.dataset.theme || (media.matches ? "dark" : "light"); }
            function refresh() { btn.innerHTML = current() === "dark" ? "&#9788;" : "&#9789;"; }
            let saved = null; try { saved = localStorage.getItem("rdprep-theme"); } catch (e) { }
            if (saved === "dark" || saved === "light") root.dataset.theme = saved;
            refresh();
            btn.addEventListener("click", function () {
                const next = current() === "dark" ? "light" : "dark";
                root.dataset.theme = next;
                try { localStorage.setItem("rdprep-theme", next); } catch (e) { }
                refresh();
            });
        })();

        // ---------- bank plumbing ----------
        function qhash(s) {
            let h = 5381;
            for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
            return h.toString(36);
        }
        const BANK_ALL = [];   // {track, t, d, q, o, a, why, id}
        Object.keys(BANKS).forEach(track => {
            (BANKS[track] || []).forEach(item => {
                BANK_ALL.push(Object.assign({ track: track, id: track.slice(0, 2) + "-" + qhash(item.q) }, item));
            });
        });
        const bankTracks = Object.keys(BANKS).filter(t => (BANKS[t] || []).length);

        // Map bank topic tags to lesson ids for "go study this" links.
        const TOPIC_LESSON = {
            raii: "raii", move: "move", stl: "stl", concurrency: "threads",
            "embedded-cpp": "cpp-embedded", memory: "cpp-memory", idioms: "move",
            classes: "cpp-classes", templates: "cpp-templates", const: "raii",
            sampling: "sampling", quantisation: "dsp-noise", fft: "fft", spectral: "dsp-spectral",
            filters: "filters", convolution: "dsp-convolution", decimation: "dsp-multirate",
            "db-snr": "dsp-noise", timing: "dsp-timing", practical: "filters",
            impedance: "impedance", attenuation: "ac-attenuation", transducers: "ac-transducers",
            beams: "ac-beams", arrays: "arrays", levitation: "arrays", waves: "ac-waves",
            measurement: "ac-measurement", doppler: "ac-doppler", practice: "pid",
            pid: "pid", stability: "ct-stability", discrete: "ct-discrete",
            statespace: "ct-statespace", kalman: "kalman", estimation: "rob-estimation",
            motion: "ct-motion", robustness: "ct-robust",
            opamps: "frontend", "passives-filters": "frontend", "adc-dac": "el-adc",
            "noise-grounding": "el-noise", power: "el-power", sensors: "el-sensors",
            buses: "el-buses", "interrupts-dma": "embedded", rtos: "embedded", "debug-pcb": "el-debug",
            structures: "structures", complexity: "cm-hash", "memory-cache": "cm-memory",
            fsm: "structures", "concurrency-concepts": "cm-concurrency",
            "linear-algebra": "cm-linalg", optimisation: "leastsq", "floating-point": "cm-float",
            "probability-stats": "cm-stats",
            ros: "rob-ros", kinematics: "rob-kinematics", locomotion: "rob-locomotion",
            perception: "rob-perception", "slam-nav": "rob-slam", actuators: "rob-actuators",
            architecture: "rob-ros", sim: "rob-sim",
            "verilog-syntax": "rtl-verilog", "blocking-nba": "rtl-nba", "rtl-design": "rtl-fsm",
            "timing-cdc": "rtl-cdc", synthesis: "rtl-synth", verification: "rtl-verif",
            systemverilog: "rtl-sv", "fpga-arch": "rtl-fpga"
        };

        function recordResult(item, correct) {
            const r = state.results[item.id] || { r: 0, w: 0, t: item.t, track: item.track };
            if (correct) r.r++; else r.w++;
            r.last = Date.now();
            r.t = item.t; r.track = item.track;
            state.results[item.id] = r;
            saveState(state);
        }
        function topicStats() {
            // aggregate results by track/topic
            const agg = {};
            Object.keys(state.results).forEach(id => {
                const r = state.results[id];
                const key = r.track + "|" + r.t;
                if (!agg[key]) agg[key] = { track: r.track, t: r.t, right: 0, wrong: 0 };
                agg[key].right += r.r; agg[key].wrong += r.w;
            });
            return Object.values(agg).map(x => Object.assign(x, {
                n: x.right + x.wrong, acc: x.right / Math.max(1, x.right + x.wrong)
            }));
        }

        // ---------- helpers ----------
        const tracks = [];
        LESSONS.forEach(l => { if (!tracks.includes(l.track)) tracks.push(l.track); });
        const byId = {};
        LESSONS.forEach(l => byId[l.id] = l);
        function pct(track) {
            const ls = track ? LESSONS.filter(l => l.track === track) : LESSONS;
            const done = ls.filter(l => state.done[l.id]).length;
            return { done, total: ls.length, pct: Math.round(100 * done / ls.length) };
        }
        function allQuestions() {
            const qs = LESSONS.map(l => ({ q: l.interview.q, a: l.interview.a, from: l.title }));
            EXTRA_QUESTIONS.forEach(e => qs.push({ q: e.q, a: e.a, from: "question bank" }));
            return qs;
        }
        function dayIndex() {
            const start = new Date("2026-01-01");
            return Math.floor((new Date() - start) / 86400000);
        }
        function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        // ---------- glossary tooltips ----------
        // Terms from glossary.js are found in rendered prose, underlined, and given a
        // tooltip. Matching is done on text nodes only, and never inside code, links or
        // headings, so nothing in a code sample gets rewritten.
        const GLOSS_LOOKUP = {};      // lowercased surface form -> canonical key
        let GLOSS_RE = null;
        (function buildGlossary() {
            if (typeof GLOSSARY !== "object") return;
            const forms = [];
            Object.keys(GLOSSARY).forEach(key => {
                [key].concat(GLOSSARY[key].aka || []).forEach(f => {
                    GLOSS_LOOKUP[f.toLowerCase()] = key;
                    forms.push(f);
                });
            });
            // longest first, so "memory barrier" wins over "memory" and
            // "-Wsizeof-pointer-memaccess" over "-Wall"-style prefixes
            forms.sort((a, b) => b.length - a.length);
            const esc = s => s.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&");
            GLOSS_RE = new RegExp(
                "(?<![A-Za-z0-9_.\\-])(" + forms.map(esc).join("|") + ")(?![A-Za-z0-9_\\-])",
                "gi");
        })();

        const GLOSS_SKIP = { PRE: 1, CODE: 1, A: 1, BUTTON: 1, SUMMARY: 1, SCRIPT: 1, STYLE: 1, H1: 1, H2: 1, H3: 1 };

        function annotateGlossary(root) {
            if (!root || !GLOSS_RE) return;
            const seen = new Set();          // one tooltip per term per container
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(n) {
                    if (!n.nodeValue || n.nodeValue.length < 2) return NodeFilter.FILTER_REJECT;
                    for (let p = n.parentNode; p && p !== root; p = p.parentNode) {
                        if (GLOSS_SKIP[p.nodeName]) return NodeFilter.FILTER_REJECT;
                        if (p.classList && p.classList.contains("gloss")) return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const nodes = [];
            let n;
            while ((n = walker.nextNode())) nodes.push(n);

            nodes.forEach(node => {
                GLOSS_RE.lastIndex = 0;
                const text = node.nodeValue;
                let m, last = 0, frag = null;
                while ((m = GLOSS_RE.exec(text)) !== null) {
                    const key = GLOSS_LOOKUP[m[1].toLowerCase()];
                    if (!key || seen.has(key)) continue;
                    seen.add(key);
                    if (!frag) frag = document.createDocumentFragment();
                    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                    const span = document.createElement("span");
                    span.className = "gloss";
                    span.setAttribute("data-term", key);
                    span.setAttribute("tabindex", "0");
                    span.textContent = m[1];
                    frag.appendChild(span);
                    last = m.index + m[1].length;
                }
                if (frag) {
                    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                    node.parentNode.replaceChild(frag, node);
                }
            });
        }

        // one floating popover, reused; a fixed-position element so it is never
        // clipped by the scrolling lesson panel
        let glossPop = null, glossAnchor = null, glossHide = null;
        function glossPopEl() {
            if (!glossPop) {
                glossPop = document.createElement("div");
                glossPop.id = "glosspop";
                glossPop.addEventListener("mouseenter", () => clearTimeout(glossHide));
                glossPop.addEventListener("mouseleave", scheduleGlossHide);
                document.body.appendChild(glossPop);
            }
            return glossPop;
        }
        function showGloss(el) {
            const key = el.getAttribute("data-term");
            const g = GLOSSARY[key];
            if (!g) return;
            clearTimeout(glossHide);
            glossAnchor = el;
            const p = glossPopEl();
            const lesson = byId[g.l];
            p.innerHTML = '<div class="gp-term">' + key + '</div>'
                + '<div class="gp-def">' + g.d + '</div>'
                + (lesson ? '<a class="gp-link" href="#lesson/' + g.l + '" target="_blank">'
                    + lesson.title + ' &rarr;</a>' : '');
            p.classList.add("show");
            // measure, then place above or below depending on room
            const r = el.getBoundingClientRect();
            const pr = p.getBoundingClientRect();
            let left = r.left + r.width / 2 - pr.width / 2;
            left = Math.max(8, Math.min(left, window.innerWidth - pr.width - 8));
            let top = r.top - pr.height - 10;
            if (top < 8) top = r.bottom + 10;
            p.style.left = left + "px";
            p.style.top = top + "px";
        }
        function scheduleGlossHide() {
            clearTimeout(glossHide);
            glossHide = setTimeout(() => {
                if (glossPop) glossPop.classList.remove("show");
                glossAnchor = null;
            }, 180);
        }
        document.addEventListener("mouseover", e => {
            const el = e.target.closest && e.target.closest(".gloss");
            if (el) showGloss(el);
        });
        document.addEventListener("mouseout", e => {
            if (e.target.closest && e.target.closest(".gloss")) scheduleGlossHide();
        });
        document.addEventListener("focusin", e => {
            const el = e.target.closest && e.target.closest(".gloss");
            if (el) showGloss(el);
        });
        document.addEventListener("click", e => {
            const el = e.target.closest && e.target.closest(".gloss");
            if (el) { e.preventDefault(); showGloss(el); }        // tap support
            else if (!e.target.closest || !e.target.closest("#glosspop")) scheduleGlossHide();
        });
        document.addEventListener("keydown", e => { if (e.key === "Escape") scheduleGlossHide(); });

        // Collapsed panel holding the lesson text that covers a question.
        // Shown under the explanation so you can read the source without leaving the test.
        function lessonRef(topicId) {
            const l = byId[topicId];
            if (!l) return "";
            return '<details class="lref"><summary>Read the lesson: ' + l.title + '</summary>'
                + '<div class="lref-body">' + l.body + '</div>'
                + '<a class="lref-open" href="#lesson/' + l.id + '" target="_blank">'
                + 'Open the full lesson in a new tab &rarr;</a></details>';
        }

        // ---------- nav ----------
        function renderNav(activeId, activeTop) {
            let h = '<a class="top' + (activeTop === "home" ? " active" : "") + '" href="#home">Dashboard</a>'
                + '<a class="top' + (activeTop === "test" ? " active" : "") + '" href="#test">Practice test</a>'
                + '<a class="top' + (activeTop === "results" ? " active" : "") + '" href="#results">My results</a>';
            tracks.forEach(t => {
                const inTrack = LESSONS.filter(l => l.track === t);
                const hasActive = inTrack.some(l => l.id === activeId);
                // a track is open if the user opened it, or it holds the lesson being read
                const open = hasActive || state.navOpen[t] === true;
                const doneN = inTrack.filter(l => state.done[l.id]).length;
                h += '<button class="track' + (open ? " open" : "") + '" data-track="' + esc(t) + '">'
                    + '<span class="caret">&#9656;</span>'
                    + '<span class="tname">' + t + '</span>'
                    + '<span class="tcount">' + doneN + '/' + inTrack.length + '</span>'
                    + '</button>';
                h += '<div class="tgroup' + (open ? " open" : "") + '">';
                inTrack.forEach(l => {
                    h += '<a class="lesson' + (l.id === activeId ? " active" : "") + '" href="#lesson/' + l.id + '">'
                        + '<span>' + l.title + '</span>'
                        + (state.done[l.id] ? '<span class="tick">&#10003;</span>' : '')
                        + '</a>';
                });
                h += '</div>';
            });
            const nav = document.getElementById("sidenav");
            nav.innerHTML = h;
            nav.querySelectorAll("button.track").forEach(b => {
                b.addEventListener("click", function () {
                    // derive from what is on screen, not from stored state: a track can be
                    // open because it holds the active lesson, which state does not record
                    const nowOpen = !b.classList.contains("open");
                    state.navOpen[b.getAttribute("data-track")] = nowOpen;
                    saveState(state);
                    b.classList.toggle("open", nowOpen);
                    b.nextElementSibling.classList.toggle("open", nowOpen);
                });
            });
            document.getElementById("streak").innerHTML = "streak: <b>" + streakCount() + "</b> day" + (streakCount() === 1 ? "" : "s");
        }

        // ---------- home ----------
        function renderHome() {
            renderNav(null, "home");
            const o = pct(null);
            const qs = allQuestions();
            const qod = qs[dayIndex() % qs.length];
            const next = LESSONS.find(l => !state.done[l.id]);
            const stats = topicStats().filter(s => s.n >= 3).sort((a, b) => a.acc - b.acc);
            let h = '<h1>Dashboard</h1>'
                + '<p class="muted">' + o.done + ' of ' + o.total + ' lessons complete &middot; '
                + BANK_ALL.length + ' bank questions available.</p>'
                + '<div class="progressbar"><div style="width:' + o.pct + '%"></div></div>'
                + '<div class="tracks">';
            tracks.forEach(t => {
                const p = pct(t);
                h += '<div class="t"><div class="name">' + t + '</div>'
                    + '<div class="progressbar"><div style="width:' + p.pct + '%"></div></div>'
                    + '<div class="n">' + p.done + ' / ' + p.total + ' lessons</div></div>';
            });
            h += '</div>'
                + '<p><a class="btn primary" href="#test">Take a practice test</a> '
                + (next ? '<a class="btn" href="#lesson/' + next.id + '">Continue: ' + next.title + '</a>' : '')
                + '</p>';
            if (stats.length) {
                h += '<h2>Your weakest topics right now</h2><table class="stats"><tr><th>Topic</th><th>Track</th><th>Accuracy</th><th></th></tr>';
                stats.slice(0, 5).forEach(s => {
                    const lid = TOPIC_LESSON[s.t];
                    h += '<tr><td>' + s.t + '</td><td class="muted">' + s.track + '</td>'
                        + '<td><span class="acc">' + Math.round(100 * s.acc) + '%</span>'
                        + '<span class="minibar"><div class="' + (s.acc >= 0.7 ? "good-bg" : "bad-bg") + '" style="width:' + Math.round(100 * s.acc) + '%"></div></span></td>'
                        + '<td>' + (lid ? '<a href="#lesson/' + lid + '">review lesson</a>' : '') + '</td></tr>';
                });
                h += '</table>';
            }
            h += '<h2>Interview question of the day</h2>'
                + '<div class="card"><div class="qq">' + qod.q + '</div>'
                + '<p class="muted" style="font-size:13px">Answer OUT LOUD first. Then compare.</p>'
                + '<button class="reveal-btn" onclick="this.nextElementSibling.classList.add(\'show\'); this.style.display=\'none\'">Reveal model answer</button>'
                + '<div class="model"><p>' + qod.a + '</p><p class="muted" style="font-size:12.5px">from: ' + qod.from + '</p></div>'
                + '</div>';
            document.getElementById("main").innerHTML = h;
        }

        // ---------- lessons ----------
        function renderLesson(id) {
            const l = byId[id];
            if (!l) { location.hash = "#home"; return; }
            renderNav(id, null);
            const idx = LESSONS.indexOf(l);
            const prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
            const best = state.quiz[id];
            let h = '<h1>' + l.title + '</h1>'
                + '<div class="lesson-meta">' + l.track + ' &middot; about ' + l.mins + ' min'
                + (best !== undefined ? ' &middot; <span class="scorechip">best quiz: ' + best + '/' + l.quiz.length + '</span>' : '')
                + '</div>'
                + '<div class="body">' + l.body + '</div>'
                + '<h2>Quiz</h2><div id="quiz"></div>'
                + '<h2>Interview question</h2>'
                + '<div class="card"><div class="qq">' + l.interview.q + '</div>'
                + '<p class="muted" style="font-size:13px">Say your answer out loud first. Seriously.</p>'
                + '<button class="reveal-btn" onclick="this.nextElementSibling.classList.add(\'show\'); this.style.display=\'none\'">Reveal model answer</button>'
                + '<div class="model"><p>' + l.interview.a + '</p></div></div>'
                + '<div class="navrow">'
                + (prev ? '<a class="btn" href="#lesson/' + prev.id + '">&larr; ' + prev.title + '</a>' : '<span></span>')
                + '<button class="btn ' + (state.done[id] ? "done" : "primary") + '" id="completeBtn">'
                + (state.done[id] ? "Completed &#10003;" : "Mark complete") + '</button>'
                + (next ? '<a class="btn" href="#lesson/' + next.id + '">' + next.title + ' &rarr;</a>' : '<span></span>')
                + '</div>';
            document.getElementById("main").innerHTML = h;
            renderLessonQuiz(l);
            document.getElementById("completeBtn").addEventListener("click", function () {
                state.done[id] = !state.done[id];
                saveState(state);
                renderLesson(id);
            });
            annotateGlossary(document.getElementById("main"));
            window.scrollTo(0, 0);
        }

        function renderLessonQuiz(l) {
            const holder = document.getElementById("quiz");
            let score = 0, answered = 0;
            l.quiz.forEach((item, qi) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = '<div class="qq">' + (qi + 1) + '. ' + item.q + '</div>';
                item.o.forEach((optText, oi) => {
                    const b = document.createElement("button");
                    b.className = "opt";
                    b.innerHTML = optText;
                    b.addEventListener("click", function () {
                        answered++;
                        const opts = card.querySelectorAll(".opt");
                        opts.forEach((x, xi) => {
                            x.disabled = true;
                            if (xi === item.a) x.classList.add("correct");
                        });
                        if (oi === item.a) { score++; }
                        else { b.classList.add("wrong"); }
                        card.querySelector(".why").classList.add("show");
                        if (answered === l.quiz.length) {
                            const prevBest = state.quiz[l.id];
                            if (prevBest === undefined || score > prevBest) {
                                state.quiz[l.id] = score; saveState(state);
                            }
                            const res = document.createElement("p");
                            res.innerHTML = "<b>Score: " + score + " / " + l.quiz.length + "</b>"
                                + (score === l.quiz.length ? " &mdash; clean sweep." : " &mdash; reread the missed ones, retake tomorrow.");
                            holder.appendChild(res);
                        }
                    });
                    card.appendChild(b);
                });
                const why = document.createElement("div");
                why.className = "why";
                why.innerHTML = item.why;
                card.appendChild(why);
                holder.appendChild(card);
            });
        }

        // ---------- practice test ----------
        let testSel = { track: "All", len: 25 };
        let test = null;   // {items, i, right, perTopic}

        function renderTestSetup() {
            renderNav(null, "test");
            test = null;
            if (!BANK_ALL.length) {
                document.getElementById("main").innerHTML = '<h1>Practice test</h1><p class="muted">Question banks not loaded.</p>';
                return;
            }
            let h = '<h1>Practice test</h1>'
                + '<p class="muted">Questions are chosen to favour ones you have not seen or got wrong. Results are saved so the dashboard can show what to study.</p>'
                + '<h3>Section</h3><div class="pills" id="trackPills"></div>'
                + '<h3>Length</h3><div class="pills" id="lenPills"></div>'
                + '<p style="margin-top:18px"><button class="btn primary" id="startBtn">Start test</button></p>';
            document.getElementById("main").innerHTML = h;
            const tp = document.getElementById("trackPills");
            ["All"].concat(bankTracks).forEach(t => {
                const b = document.createElement("button");
                b.className = "pill" + (testSel.track === t ? " sel" : "");
                const count = t === "All" ? BANK_ALL.length : (BANKS[t] || []).length;
                b.textContent = t + " (" + count + ")";
                b.addEventListener("click", () => { testSel.track = t; renderTestSetup(); });
                tp.appendChild(b);
            });
            const lp = document.getElementById("lenPills");
            [10, 25, 50, 100].forEach(n => {
                const b = document.createElement("button");
                b.className = "pill" + (testSel.len === n ? " sel" : "");
                b.textContent = n + " questions";
                b.addEventListener("click", () => { testSel.len = n; renderTestSetup(); });
                lp.appendChild(b);
            });
            document.getElementById("startBtn").addEventListener("click", startTest);
        }

        function startTest() {
            let pool = testSel.track === "All" ? BANK_ALL.slice() : BANK_ALL.filter(x => x.track === testSel.track);
            // weight: unseen first, then most-wrong, with randomness
            pool.forEach(x => {
                const r = state.results[x.id];
                x._w = (r ? (r.r - r.w) : -0.5) + Math.random() * 0.9;
            });
            pool.sort((a, b) => a._w - b._w);
            const items = pool.slice(0, Math.min(testSel.len, pool.length));
            // shuffle presentation order
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            test = { items, i: 0, right: 0, perTopic: {} };
            renderTestQ();
        }

        function renderTestQ() {
            renderNav(null, "test");
            const item = test.items[test.i];
            let h = '<div class="testhead"><h1>Question ' + (test.i + 1) + ' / ' + test.items.length + '</h1>'
                + '<span class="muted">' + item.track + ' &middot; ' + item.t + '</span></div>'
                + '<div class="progressbar"><div style="width:' + Math.round(100 * test.i / test.items.length) + '%"></div></div>'
                + '<div class="card"><div class="qq">' + item.q + '</div><div id="opts"></div>'
                + '<div class="why" id="why">' + item.why + lessonRef(item.t) + '</div></div>'
                + '<div class="navrow"><button class="btn" id="quitBtn">End test</button>'
                + '<button class="btn primary" id="nextBtn" style="display:none">Next &rarr;</button></div>';
            document.getElementById("main").innerHTML = h;
            const optsDiv = document.getElementById("opts");
            item.o.forEach((optText, oi) => {
                const b = document.createElement("button");
                b.className = "opt"; b.innerHTML = optText;
                b.addEventListener("click", function () {
                    const all = optsDiv.querySelectorAll(".opt");
                    all.forEach((x, xi) => { x.disabled = true; if (xi === item.a) x.classList.add("correct"); });
                    const ok = oi === item.a;
                    if (!ok) b.classList.add("wrong"); else test.right++;
                    const pt = test.perTopic[item.t] || { right: 0, n: 0, track: item.track };
                    pt.n++; if (ok) pt.right++;
                    test.perTopic[item.t] = pt;
                    recordResult(item, ok);
                    document.getElementById("why").classList.add("show");
                    document.getElementById("nextBtn").style.display = "";
                });
                optsDiv.appendChild(b);
            });
            document.getElementById("nextBtn").addEventListener("click", function () {
                test.i++;
                if (test.i >= test.items.length) renderTestDone(); else renderTestQ();
            });
            document.getElementById("quitBtn").addEventListener("click", function () {
                if (test.i > 0 || document.getElementById("why").classList.contains("show")) renderTestDone();
                else { location.hash = "#test"; renderTestSetup(); }
            });
            annotateGlossary(document.getElementById("main"));
            window.scrollTo(0, 0);
        }

        function renderTestDone() {
            renderNav(null, "test");
            const answered = Object.values(test.perTopic).reduce((s, x) => s + x.n, 0);
            const pctScore = answered ? Math.round(100 * test.right / answered) : 0;
            let h = '<h1>Test complete</h1>'
                + '<p><b>' + test.right + ' / ' + answered + ' (' + pctScore + '%)</b></p>'
                + '<h2>This test by topic</h2><table class="stats"><tr><th>Topic</th><th>Track</th><th>Score</th><th></th></tr>';
            Object.keys(test.perTopic).map(t => Object.assign({ t }, test.perTopic[t]))
                .sort((a, b) => (a.right / a.n) - (b.right / b.n))
                .forEach(s => {
                    const lid = TOPIC_LESSON[s.t];
                    h += '<tr><td>' + s.t + '</td><td class="muted">' + s.track + '</td>'
                        + '<td>' + s.right + '/' + s.n + '</td>'
                        + '<td>' + (lid ? '<a href="#lesson/' + lid + '">review lesson</a>' : '') + '</td></tr>';
                });
            h += '</table>'
                + '<p style="margin-top:16px"><a class="btn primary" href="#test" onclick="test=null">Another test</a> '
                + '<a class="btn" href="#results">See all my results</a></p>';
            document.getElementById("main").innerHTML = h;
            test = null;
        }

        // ---------- results ----------
        function renderResults() {
            renderNav(null, "results");
            const stats = topicStats();
            const totalR = stats.reduce((s, x) => s + x.right, 0);
            const totalW = stats.reduce((s, x) => s + x.wrong, 0);
            let h = '<h1>My results</h1>';
            if (!stats.length) {
                h += '<p class="muted">No test answers recorded yet. <a href="#test">Take a practice test</a> and your accuracy by topic will appear here.</p>';
                document.getElementById("main").innerHTML = h;
                return;
            }
            h += '<p><b>' + totalR + '</b> right, <b>' + totalW + '</b> wrong overall ('
                + Math.round(100 * totalR / Math.max(1, totalR + totalW)) + '%). '
                + Object.keys(state.results).length + ' distinct questions attempted of ' + BANK_ALL.length + '.</p>';

            // per track
            h += '<h2>By section</h2><table class="stats"><tr><th>Section</th><th>Attempted</th><th>Accuracy</th></tr>';
            bankTracks.forEach(tr => {
                const s = stats.filter(x => x.track === tr);
                const r = s.reduce((a, x) => a + x.right, 0), w = s.reduce((a, x) => a + x.wrong, 0);
                const seen = Object.values(state.results).filter(x => x.track === tr).length;
                const acc = r + w ? Math.round(100 * r / (r + w)) : 0;
                h += '<tr><td>' + tr + '</td><td class="muted">' + seen + ' / ' + (BANKS[tr] || []).length + ' questions</td>'
                    + '<td><span class="acc">' + (r + w ? acc + '%' : '-') + '</span>'
                    + '<span class="minibar"><div class="' + (acc >= 70 ? "good-bg" : "bad-bg") + '" style="width:' + acc + '%"></div></span></td></tr>';
            });
            h += '</table>';

            // per topic, weakest first
            h += '<h2>By topic (weakest first)</h2><table class="stats"><tr><th>Topic</th><th>Track</th><th>Answered</th><th>Accuracy</th><th></th></tr>';
            stats.sort((a, b) => a.acc - b.acc).forEach(s => {
                const lid = TOPIC_LESSON[s.t];
                const acc = Math.round(100 * s.acc);
                h += '<tr><td>' + s.t + '</td><td class="muted">' + s.track + '</td><td>' + s.n + '</td>'
                    + '<td><span class="acc">' + acc + '%</span>'
                    + '<span class="minibar"><div class="' + (acc >= 70 ? "good-bg" : "bad-bg") + '" style="width:' + acc + '%"></div></span></td>'
                    + '<td>' + (lid ? '<a href="#lesson/' + lid + '">review lesson</a>' : '') + '</td></tr>';
            });
            h += '</table>'
                + '<p style="margin-top:20px"><button class="btn" id="resetBtn">Reset all test results</button></p>';
            document.getElementById("main").innerHTML = h;
            document.getElementById("resetBtn").addEventListener("click", function () {
                if (confirm("Delete all saved test results? Lesson completion is kept.")) {
                    state.results = {}; saveState(state); renderResults();
                }
            });
        }

        // ---------- router ----------
        function route() {
            const h = location.hash || "#home";
            if (h.startsWith("#lesson/")) renderLesson(h.slice(8));
            else if (h === "#test") { if (test && test.items && test.i < test.items.length) renderTestQ(); else renderTestSetup(); }
            else if (h === "#results") renderResults();
            else renderHome();
        }
        window.addEventListener("hashchange", route);
        route();
    </script>
</body>

</html>
